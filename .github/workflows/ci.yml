name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-painel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:painel
      - run: npm test
      - run: npm run build:painel

  agente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester e PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path agente -Recurse -Settings agente/PSScriptAnalyzerSettings.psd1 -Severity Error -EnableExit
          Invoke-Pester -Path agente/tests -CI
